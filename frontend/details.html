<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AptioGen - Complete Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --card-bg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.1);
      --border-color: #e5e7eb;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
    }

    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .details-container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px var(--shadow);
      border: 1px solid var(--border-color);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      font-size: 2rem;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 14px;
    }

    .label-required::after {
      content: ' *';
      color: #ef4444;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-group input[readonly] {
      background: #f9fafb;
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      gap: 10px;
    }

    .step {
      flex: 1;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
    }

    .step.active {
      background: var(--accent-primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .info-message {
      background: #e0f2fe;
      color: #0369a1;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      border-left: 3px solid #0369a1;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .skip-link {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .skip-link a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .skip-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="details-container">
    <div class="header">
      <div class="user-avatar" id="userAvatar">
        <i class="fas fa-user"></i>
      </div>
      <h1>Complete Your Profile</h1>
      <p>Join our community of learners</p>
    </div>

    <div class="progress-steps">
      <div class="step active"></div>
      <div class="step active"></div>
      <div class="step active"></div>
    </div>

    <div class="info-message">
      <i class="fas fa-info-circle"></i> Complete your profile to access all features and track your progress
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="detailsForm">
      <div class="form-group">
        <label for="username" class="label-required">Full Name</label>
        <input type="text" id="username" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Your email" readonly>
      </div>

      <div class="form-group" id="rollNoGroup">
        <label for="rollNumber" class="label-required">Roll Number</label>
        <input type="text" id="rollNumber" placeholder="Enter your roll number">
      </div>

      <div class="form-group">
        <label for="college" class="label-required">College</label>
        <select id="college" required>
          <option value="">Loading institutions…</option>
        </select>
        <p id="collegeStatus" style="font-size:12px;margin-top:5px;color:#6b7280;"></p>
      </div>

      <div class="form-group">
        <label for="department" class="label-required">Department</label>
        <select id="department" required disabled>
          <option value="">Select your department</option>
        </select>
      </div>

      <div class="form-group" id="batchGroup">
        <label for="batch" class="label-required">Batch (Admission Year)</label>
        <select id="batch" required disabled>
          <option value="">Select your batch</option>
        </select>
      </div>

      <div class="form-group">
        <label for="city" class="label-required">City</label>
        <input type="text" id="city" placeholder="Enter your city" required>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="btnText">Continue to Dashboard</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="skip-link">
      <a href="#" id="skipLink">Skip for now</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { authAPI } from "./js/api.js";
    import API_CONFIG from "./js/config.js";

    const DEPT_MAP = {
      "aids": "Artificial Intelligence and Data Science",
      "cs": "Computer Science",
      "it": "Information Technology",
      "mechanical": "Mechanical Engineering",
      "civil": "Civil Engineering",
      "ece": "Electronics and Communication",
      "eee": "Electrical and Electronics"
    };

    let allInstitutionBatches = [];
    let allInstitutionDepts = [];

    /* ── Load registered institutions into the college dropdown ── */
    async function loadInstitutions() {
      const select = document.getElementById('college');
      const status = document.getElementById('collegeStatus');
      try {
        const res = await fetch(`${API_CONFIG.API_URL}/public/institutions`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.institutions || []);

        select.innerHTML = '<option value="">Select your college</option>';

        if (list.length === 0) {
          status.textContent = 'No registered institutions found.';
        } else {
          list.forEach(inst => {
            const name = inst.name || inst.institutionName || inst.collegeName || '';
            if (!name) return;
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            opt.dataset.institutionId = inst._id || '';
            select.appendChild(opt);
          });
          select.appendChild(new Option('Other', 'Other'));
          status.textContent = `${list.length} registered institutions available`;
        }
      } catch (err) {
        console.warn('Could not load institutions:', err.message);
        select.innerHTML = `
          <option value="">Select your college</option>
          <option value="NIT Trichy">NIT Trichy</option>
          <option value="IIT Madras">IIT Madras</option>
          <option value="Other">Other</option>`;
        status.textContent = 'Using default options.';
      }
    }

    /* ── Load Departments and Batches for a specific institution ── */
    async function loadInstitutionData(instId) {
      if (!instId || instId === 'Other') {
        resetCascadingFields();
        return;
      }

      try {
        const [deptRes, batchRes] = await Promise.all([
          fetch(`${API_CONFIG.API_URL}/public/institutions/${instId}/departments`),
          fetch(`${API_CONFIG.API_URL}/public/institutions/${instId}/batches`)
        ]);

        allInstitutionDepts = await deptRes.json();
        allInstitutionBatches = await batchRes.json();

        updateDepts(allInstitutionDepts);
        updateBatches(); // Initial load for global batches
      } catch (err) {
        console.error('Failed to load institution data:', err);
      }
    }

    function resetCascadingFields() {
      const deptSelect = document.getElementById('department');
      const batchSelect = document.getElementById('batch');
      
      deptSelect.innerHTML = '<option value="">Select your department</option>';
      deptSelect.disabled = true;
      
      batchSelect.innerHTML = '<option value="">Select your batch</option>';
      batchSelect.disabled = true;
      
      if (document.getElementById('college').value === 'Other') {
        const customDepts = Object.values(DEPT_MAP).concat(["Other"]);
        deptSelect.innerHTML = '<option value="">Select your department</option>';
        customDepts.forEach(d => deptSelect.add(new Option(d, d)));
        deptSelect.disabled = false;

        batchSelect.innerHTML = '<option value="">Select your batch</option>';
        [2021, 2022, 2023, 2024, 2025].forEach(y => batchSelect.add(new Option(`${y} Admission`, y)));
        batchSelect.disabled = false;
      }
    }

    function updateDepts(depts) {
      const select = document.getElementById('department');
      select.innerHTML = '<option value="">Select your department</option>';
      (depts || []).forEach(d => {
        const opt = new Option(d.name, d.name); // Using long name for both
        opt.dataset.deptId = d._id;
        select.add(opt);
      });
      select.add(new Option('Other', 'Other'));
      select.disabled = false;
    }

    function updateBatches() {
      const deptId = document.getElementById('department').selectedOptions[0]?.dataset.deptId;
      const select = document.getElementById('batch');
      select.innerHTML = '<option value="">Select your batch</option>';
      
      const filtered = allInstitutionBatches.filter(b => !b.departmentId || b.departmentId === deptId);
      
      filtered.forEach(b => {
        const label = `${b.startYear} - ${b.endYear} (${b.batchID})`;
        const opt = new Option(label, b._id);
        opt.dataset.batchId = b._id;
        select.add(opt);
      });

      if (filtered.length === 0) {
        select.add(new Option('No batches available', ''));
      }
      
      select.disabled = false;
    }

    // Event Listeners for cascading
    document.getElementById('college').addEventListener('change', async (e) => {
      const instId = e.target.selectedOptions[0]?.dataset.institutionId;
      await loadInstitutionData(instId);
      document.dispatchEvent(new CustomEvent('collegeLoaded'));
    });

    document.getElementById('department').addEventListener('change', () => {
      if (allInstitutionBatches.length > 0) updateBatches();
      document.dispatchEvent(new CustomEvent('deptLoaded'));
    });

    loadInstitutions();

    const detailsForm = document.getElementById("detailsForm");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const userAvatar = document.getElementById("userAvatar");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      successMessage.style.display = 'none';
      setTimeout(() => errorMessage.style.display = 'none', 5000);
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.style.display = 'block';
      errorMessage.style.display = 'none';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.innerHTML = isLoading ? '<span class="spinner"></span> Saving...' : 'Continue to Dashboard';
    }

    // Load user data & Pre-fill logic with cascading triggers
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      
      document.getElementById("email").value = user.email;
      if (user.photoURL) userAvatar.innerHTML = `<img src="${user.photoURL}" alt="Profile">`;
      else if (user.displayName) userAvatar.textContent = user.displayName.split(' ').map(n => n[0]).join('').toUpperCase();
      if (user.displayName) document.getElementById("username").value = user.displayName;

      try {
        const profile = await authAPI.getProfile();
        const pending = JSON.parse(sessionStorage.getItem('pendingProfile') || '{}');
        
        const data = profile || pending;
        if (data) {
          if (data.username || data.name) document.getElementById("username").value = data.username || data.name;
          if (data.rollNumber) document.getElementById("rollNumber").value = data.rollNumber;
          if (data.city) document.getElementById("city").value = data.city;
          
          // Cascading pre-fill: College -> Dept -> Batch
          if (data.college || data.institutionName) {
            const collSelect = document.getElementById("college");
            const checkInt = setInterval(() => {
              if (collSelect.options.length > 1) {
                clearInterval(checkInt);
                const targetText = data.college || data.institutionName;
                for (let opt of collSelect.options) {
                  if (opt.text === targetText || opt.value === targetText) {
                    collSelect.value = opt.value;
                    const event = new Event('change');
                    collSelect.dispatchEvent(event);
                    
                    // Wait for college data to load depts
                    const onCollegeLoaded = () => {
                      document.removeEventListener('collegeLoaded', onCollegeLoaded);
                      const deptSelect = document.getElementById('department');
                      let targetDept = data.department || data.departmentName;
                      if (DEPT_MAP[targetDept]) targetDept = DEPT_MAP[targetDept]; // Fix legacy 'aids' etc.
                      
                      for (let dOpt of deptSelect.options) {
                        if (dOpt.text === targetDept || dOpt.value === targetDept) {
                          deptSelect.value = dOpt.value;
                          deptSelect.dispatchEvent(new Event('change'));
                          
                          // Wait for dept change to load batches
                          const onDeptLoaded = () => {
                            document.removeEventListener('deptLoaded', onDeptLoaded);
                            const batchSelect = document.getElementById('batch');
                            const targetBatch = data.batchId || data.yearId;
                            if (targetBatch) {
                              const bId = typeof targetBatch === 'object' ? targetBatch._id : targetBatch;
                              for (let bOpt of batchSelect.options) {
                                if (bOpt.value === bId || bOpt.text.includes(targetBatch)) {
                                  batchSelect.value = bOpt.value;
                                  break;
                                }
                              }
                            }
                          };
                          document.addEventListener('deptLoaded', onDeptLoaded);
                          break;
                        }
                      }
                    };
                    document.addEventListener('collegeLoaded', onCollegeLoaded);
                    break;
                  }
                }
              }
            }, 100);
          }
        }
      } catch (err) { console.log("Profile load failed", err); }
    });

    detailsForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      setLoading(true);
      const pendingProfile = JSON.parse(sessionStorage.getItem('pendingProfile') || '{}');
      
      const collSelect = document.getElementById("college");
      const deptSelect = document.getElementById("department");
      const batchSelect = document.getElementById("batch");

      const profileData = {
        username: document.getElementById("username").value.trim(),
        email: user.email,
        department: deptSelect.value, // Long name stored as value
        college: collSelect.value,
        city: document.getElementById("city").value.trim(),
        rollNumber: document.getElementById("rollNumber").value.trim(),
        photoURL: user.photoURL || null,
        provider: user.providerData[0]?.providerId === 'google.com' ? 'google' : 'email',
        role: pendingProfile.role || 'student',
        institutionId: collSelect.selectedOptions[0]?.dataset.institutionId || pendingProfile.institutionId,
        departmentId: deptSelect.selectedOptions[0]?.dataset.deptId || pendingProfile.departmentId,
        batchId: batchSelect.value || pendingProfile.batchId
      };

      try {
        await authAPI.saveProfile(profileData);
        showSuccess("Profile saved successfully! Redirecting...");
        sessionStorage.removeItem('pendingProfile');
        setTimeout(() => window.location.href = "explore.html", 1500);
      } catch (error) {
        showError(error.message || "Failed to save profile.");
        setLoading(false);
      }
    });

    document.getElementById("skipLink").addEventListener("click", () => {
      if (confirm("Skip profile completion?")) window.location.href = "explore.html";
    });

  </script>
</body>

</html>
